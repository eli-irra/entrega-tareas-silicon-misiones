<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas — TP Clase 13 (DOM)</title>
  <style>
    /* ===== Estilos base (ya hechos, no hace falta que los toques) ===== */
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #F1F2F2;
      color: #20203A;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(43, 41, 109, 0.12);
      padding: 26px;
    }
    h1 { color: #2B296D; font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6E6E80; font-size: 13px; margin: 0 0 20px; }
    .fila { display: flex; gap: 8px; margin-bottom: 16px; }
    #nuevaTarea {
      flex: 1;
      padding: 11px 12px;
      border: 1.5px solid #CFD0DA;
      border-radius: 8px;
      font-size: 15px;
    }
    #nuevaTarea:focus { outline: none; border-color: #0E6689; }
    #agregar {
      background: #0E6689;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #agregar:hover { background: #0b4f68; }
    #lista { list-style: none; padding: 0; margin: 0; }
    #lista li {
      background: #F7F7FA;
      border: 1px solid #E7E7EE;
      border-radius: 8px;
      padding: 11px 12px;
      margin-bottom: 8px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between; /* Para separar el texto del botón eliminar */
      align-items: center;
    }
    /* Clase para tachar una tarea hecha. La activás desde el JS con classList */
    #lista li.hecha {
      text-decoration: line-through;
      color: #9A9AAB;
      background: #EFEFF3;
    }
    #contador { color: #2B296D; font-weight: 600; font-size: 14px; margin-top: 16px; }
    
    /* Estilo adicional para el botón eliminar (Bonus Nivel 3) */
    .btn-eliminar {
      background: transparent;
      border: 1px solid #CFD0DA;
      border-radius: 4px;
      color: #9A9AAB;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 12px;
    }
    .btn-eliminar:hover {
      background: #e74c3c;
      color: white;
      border-color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Mi Lista de Tareas</h1>
    <p class="sub">TP Clase 13 · El DOM</p>

    <!-- input + botón para agregar -->
    <div class="fila">
      <input id="nuevaTarea" type="text" placeholder="Escribí una tarea..." />
      <button id="agregar">Agregar</button>
    </div>

    <!-- acá se van a ir agregando las tareas (las crea el JS) -->
    <ul id="lista"></ul>

    <!-- contador de tareas -->
    <p id="contador">Tareas: 0</p>
  </div>

  <script>
    // ============================================================
    //  TP CLASE 13 — LISTA DE TAREAS completado
    // ============================================================

    // 1) SELECCIONAR los elementos
    let input    = document.querySelector("#nuevaTarea");
    let boton    = document.querySelector("#agregar");
    let lista    = document.querySelector("#lista");
    let contador = document.querySelector("#contador");

    // 2) Función para actualizar el contador
    function actualizarContador() {
      let pendientes = document.querySelectorAll('#lista li:not(.hecha)').length;
      contador.textContent = "Tareas pendientes: " + pendientes;
    }

    // 3) EVENTO: cuando se hace click en "Agregar", crear una tarea
    boton.addEventListener("click", function () {
      let texto = input.value.trim();

      // TODO (Bonus): si el texto está vacío, no agregar nada (return)
      if (texto === "") return;

      // TODO (Nivel 1): crear un <li> y ponerle el texto
      let li = document.createElement("li");
      
      let spanTexto = document.createElement("span");
      spanTexto.textContent = texto;
      li.appendChild(spanTexto);

      let btnEliminar = document.createElement("button");
      btnEliminar.textContent = "X";
      btnEliminar.classList.add("btn-eliminar");
      
      btnEliminar.addEventListener("click", function (e) {
        e.stopPropagation(); // Evita que al clickear "X" se marque la tarea como hecha
        li.remove();
        actualizarContador();
      });
      li.appendChild(btnEliminar);

      // TODO (Nivel 2): al hacer click en el <li>, marcarlo como hecho
      li.addEventListener("click", function () {
        li.classList.toggle("hecha");
        actualizarContador();
      });

      // Agregar el <li> terminado a la lista
      lista.appendChild(li);

      input.value = "";          // limpiar el input
      actualizarContador();      // refrescar el contador
    });

    // TODO (Bonus): permitir agregar con la tecla Enter
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        boton.click();
      }
    });
  </script>
</body>
</html>
